CONFIG_CPP=y

CONFIG_SMP=n
CONFIG_MP_MAX_NUM_CPUS=2

# --- Display Framework ---
CONFIG_DISPLAY=y
CONFIG_ILI9341=y
CONFIG_SPI=y

# --- Modern Zephyr LVGL Core Initialization ---
CONFIG_LVGL=y
CONFIG_LV_Z_MEM_POOL_SIZE=16384

# Allocate dedicated rendering buffer space (Mandatory to prevent early initialization null crashes)
CONFIG_LV_Z_VDB_SIZE=64

# Match the ILI9341 devicetree pixel format <1> (RGB565)
CONFIG_LV_COLOR_DEPTH_16=y

# Explicitly ensure the standard text rendering widget is compiled
CONFIG_LV_USE_LABEL=y

# --- Hardware System Specs ---
CONFIG_LOG=y
